<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PostService — Список відправлень</title>
    <link rel="stylesheet" href="css/site.css">
    <script type="module" src="js/posting-list.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">PostService</a>
        <button class="menu-toggle" type="button" aria-label="Меню" aria-expanded="false">&#9776;</button>
        <nav class="site-nav">
            <a href="postings.html" aria-current="page">Список відправлень</a>
            <a href="about.html">Про програму</a>
        </nav>
    </header>

    <main class="page">
        <div class="page-head">
            <h1>Список поштових відправлень</h1>
            <a class="btn primary" href="posting-edit.html">+ Нове відправлення</a>
        </div>

        <div class="alert" id="alert" role="alert" hidden></div>

        <div class="toolbar">
            <button class="btn" type="button" id="edit-button" disabled>Редагувати</button>
            <button class="btn danger" type="button" id="delete-button" disabled>Видалити</button>
        </div>

        <table class="grid">
            <thead>
                <tr>
                    <th>Відправник</th>
                    <th>Отримувач</th>
                    <th>Вміст</th>
                    <th>Тип доставки</th>
                    <th class="num">Вага, кг</th>
                    <th class="num">Цінність</th>
                    <th class="num">Вартість</th>
                </tr>
            </thead>
            <tbody id="postings-rows"></tbody>
        </table>

        <div class="cards" id="postings-cards"></div>

        <p class="empty" id="empty" hidden>Відправлень немає.</p>
    </main>

    <div class="overlay" id="confirm" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h2 id="confirm-title"><span class="warn">&#9888;</span> Підтвердження видалення</h2>
            <p id="confirm-text"></p>
            <div class="modal-actions">
                <button class="btn" type="button" id="confirm-cancel">Скасувати</button>
                <button class="btn danger" type="button" id="confirm-ok">Видалити</button>
            </div>
        </div>
    </div>
</body>
</html>
