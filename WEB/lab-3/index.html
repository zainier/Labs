<!DOCTYPE html>
<html lang="uk"></html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Робота з блочними та вбудованими елементами</title>
</head>
<body>
    <main>
        <div class="first-block">
            <h1>Це блочний елемент</h1>
            <p>Він займає всю ширину контейнера.</p>
        </div>
        Це <strong class="inline-text">лінійний</strong> текст з <a href="https://www.google.com/">посиланням</a>.
        <div class="second-block">
            <p class="second-block__title">Ще один блочний елемент</p>
            <p>Цей має інший фон і границі.</p>  
        </div>
        <div class="third-block">
            <div class="third-block__element">
                Елемент 1
            </div>
            <div class="third-block__element">
                Елемент 2
            </div>
            <div class="third-block__element">
                Елемент 3
            </div>
        </div>
    </main>
</body>
</html>
